{% extends "auth.html" %}
{% block title %}Logga In{% endblock %}
{% block content %}
  <div class="container">
    {% call auth_card("Logga In") %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="username">Användarnamn</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Skriv användarnamn" required="required"/>
      </div>
      <div class="form-group">
        <label for="password">Lösenord</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Skriv lösenord" required="required"/>
      </div>
      <br/>
      <button type="submit" class="btn btn-outline-primary">Logga In</button>
    </form>
    {% endcall %}
  </div>
{% endblock %}
